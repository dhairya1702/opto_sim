<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">Proposed fictional patient and examination chair</title><desc id="desc">An original vector concept of a naturally proportioned young adult with shaped eyelids, fitted clothing, fingers and a slim upholstered examination chair. A visual design study, not a clinical anatomy reference or a finished 3D asset.</desc>
