<style>
#opto-guidance-preview {font-family:Inter, ui-sans-serif, system-ui, sans-serif;color:#eaf4f2;--hud-bottom:7%;--hud-radius:22px;}
#opto-guidance-preview * {box-sizing:border-box;}
#opto-guidance-preview .preview-toolbar {background:#142321;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap;font-size:13px;}
#opto-guidance-preview .style-picker {display:flex;gap:6px;}
#opto-guidance-preview button {font:inherit;min-height:40px;padding:8px 14px;border:1px solid #49615c;border-radius:8px;color:#eaf4f2;background:#243b36;cursor:pointer;}
#opto-guidance-preview button[aria-pressed="true"] {background:#d9eee6;color:#162f28;border-color:#d9eee6;}
#opto-guidance-preview .clinic-view {position:relative;overflow:hidden;background:#202d2a;isolation:isolate;}
#opto-guidance-preview .clinic-image {display:block;width:100%;height:auto;}
#opto-guidance-preview .wall-patch {position:absolute;left:44.65%;top:32.15%;width:12.8%;height:7.6%;background:linear-gradient(110deg,#25312d,#25302c);}
#opto-guidance-preview .guidance {position:absolute;left:50%;bottom:var(--hud-bottom);transform:translateX(-50%);width:48%;max-width:530px;padding:20px 25px;text-align:center;border-radius:var(--hud-radius);border:1px solid #d7fff24d;background:linear-gradient(130deg,#3c514cd9,#102822eb);box-shadow:0 14px 35px #0005,inset 0 1px 0 #ffffff30;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#f4fcf9;pointer-events:none;}
#opto-guidance-preview .step-title {font-size:clamp(16px,2.3vw,23px);font-weight:600;line-height:1.3;margin-bottom:7px;}
#opto-guidance-preview .step-detail {font-size:clamp(13px,1.7vw,16px);font-weight:400;line-height:1.5;}
#opto-guidance-preview[data-style="light"] .guidance {background:linear-gradient(130deg,#f5fff6e8,#d6e5dbd9);border-color:#ffffffb3;color:#15362d;box-shadow:0 14px 35px #001a2440,inset 0 1px 0 #ffffffd9;}
@media(max-width:550px){#opto-guidance-preview .clinic-view {height:410px;}#opto-guidance-preview .clinic-image {width:615px;height:410px;max-width:none;position:absolute;left:50%;transform:translateX(-50%);}#opto-guidance-preview .wall-patch {left:calc(50% - 33px);top:132px;width:79px;height:32px;}#opto-guidance-preview .guidance {width:88%;padding:14px 16px;}#opto-guidance-preview .preview-toolbar {padding:12px;}}
</style>
<script>
(() => {
  const root = document.getElementById('opto-guidance-preview');
  const state = {style:'dark', bottom:7, radius:22};
  function render() {
    root.dataset.style = state.style;
    root.style.setProperty('--hud-bottom', state.bottom + '%');
    root.style.setProperty('--hud-radius', state.radius + 'px');
    root.querySelectorAll('[data-style]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.style === state.style)));
  }
  root.querySelectorAll('button[data-style]').forEach(button => button.addEventListener('click', () => {state.style = button.dataset.style; render();}));
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root.querySelector('.guidance'),onChange:render});
    tweak.addSelect(state,'style',{label:'Glass style',options:[{label:'Dark glass',value:'dark'},{label:'Light frost',value:'light'}]});
    tweak.addSlider(state,'bottom',{label:'Space below card',min:3,max:15,unit:'%'});
    tweak.addSlider(state,'radius',{label:'Corner radius',min:8,max:30,unit:'px'});
  }
})();
</script>
